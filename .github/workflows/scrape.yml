name: Refresh contest snapshot

on:
  schedule:
    - cron: '0 8,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run scrape
      - name: Commit snapshot if changed
        run: |
          git config user.name "giftradar-bot"
          git config user.email "giftradar-bot@users.noreply.github.com"
          git add web/public/feed.snapshot.json
          git diff --cached --quiet || git commit -m "Snapshot concours auto (${{ github.run_id }})"
          git push
